name: Build signed Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -F "versionName = \"$version\"" app/build.gradle.kts

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chatspace-release.jks"
          chmod 600 "$RUNNER_TEMP/chatspace-release.jks"

      - name: Build signed APK and Play bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/chatspace-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDirectRelease :app:bundlePlayRelease

      - name: Prepare and verify artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/direct/release/app-direct-release.apk dist/ChatSpace.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab dist/ChatSpace-Play.aab
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs dist/ChatSpace.apk
          sha256sum dist/ChatSpace.apk dist/ChatSpace-Play.aab > dist/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatspace-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "ChatSpace Android $GITHUB_REF_NAME"
